workflows:

  android-debug-apk:
    name: PhotoPractice Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        ANDROID_DIR: "android-app"
    scripts:
      - name: Show Android source size
        script: |
          du -sh "$ANDROID_DIR"
      - name: Build debug APK
        script: |
          cd "$ANDROID_DIR"
          if ! command -v gradle >/dev/null 2>&1; then
            curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH="/tmp/gradle-8.10.2/bin:$PATH"
          fi
          gradle :app:assembleDebug --no-daemon
    artifacts:
      - android-app/app/build/outputs/apk/debug/*.apk

  ios-reader-dev:
    name: PhotoPractice Reader iOS Compile Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        IOS_DIR: "ios-app"
        BUNDLE_ID: "com.local.photopractice"
        XCODE_PROJECT: "PhotoPractice.xcodeproj"
        XCODE_SCHEME: "PhotoPractice"
    scripts:
      - name: Show app source size
        script: |
          du -sh "$IOS_DIR"
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Configure bundle id
        script: |
          cd "$IOS_DIR"
          bash scripts/set-ios-bundle-id.sh "$BUNDLE_ID"
      - name: Validate reader app source
        script: |
          cd "$IOS_DIR"
          bash scripts/validate-ios-offline.sh
      - name: Generate Xcode project
        script: |
          cd "$IOS_DIR"
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd "$IOS_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios-app/PhotoPractice.xcodeproj
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-sideloadly-ipa:
    name: PhotoPractice Unsigned IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        IOS_DIR: "ios-app"
        BUNDLE_ID: "com.local.photopractice"
        XCODE_PROJECT: "PhotoPractice.xcodeproj"
        XCODE_SCHEME: "PhotoPractice"
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Configure bundle id
        script: |
          cd "$IOS_DIR"
          bash scripts/set-ios-bundle-id.sh "$BUNDLE_ID"
      - name: Validate reader app source
        script: |
          cd "$IOS_DIR"
          bash scripts/validate-ios-offline.sh
      - name: Generate Xcode project
        script: |
          cd "$IOS_DIR"
          xcodegen generate
      - name: Build unsigned device app
        script: |
          cd "$IOS_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          cd "$IOS_DIR"
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/PhotoPractice.app"
          test -d "$APP_PATH"
          rm -rf build/sideloadly
          mkdir -p build/sideloadly/Payload
          cp -R "$APP_PATH" build/sideloadly/Payload/
          cd build/sideloadly
          zip -qry ../PhotoPractice-unsigned.ipa Payload
    artifacts:
      - ios-app/build/PhotoPractice-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: PhotoPractice TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.photopractice
      vars:
        IOS_DIR: "ios-app"
        BUNDLE_ID: "com.yourname.photopractice"
        XCODE_PROJECT: "PhotoPractice.xcodeproj"
        XCODE_SCHEME: "PhotoPractice"
    scripts:
      - name: Show app source size
        script: |
          du -sh "$IOS_DIR"
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Configure bundle id
        script: |
          cd "$IOS_DIR"
          bash scripts/set-ios-bundle-id.sh "$BUNDLE_ID"
      - name: Validate reader app source
        script: |
          cd "$IOS_DIR"
          bash scripts/validate-ios-offline.sh
      - name: Generate Xcode project
        script: |
          cd "$IOS_DIR"
          xcodegen generate
      - name: Set up App Store code signing
        script: |
          cd "$IOS_DIR"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          cd "$IOS_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
