# Compatibility copy for Codemagic apps configured with ios-app as the project root.
# Preferred setup: use the repository-root ../codemagic.yaml.

workflows:
  ios-reader-dev:
    name: PhotoPractice Reader iOS Compile Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.local.photopractice"
        XCODE_PROJECT: "PhotoPractice.xcodeproj"
        XCODE_SCHEME: "PhotoPractice"
    scripts:
      - name: Show app source size
        script: |
          du -sh .
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Configure bundle id
        script: |
          bash scripts/set-ios-bundle-id.sh "$BUNDLE_ID"
      - name: Validate reader app source
        script: |
          bash scripts/validate-ios-offline.sh
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - PhotoPractice.xcodeproj
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: PhotoPractice TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.photopractice
      vars:
        BUNDLE_ID: "com.yourname.photopractice"
        XCODE_PROJECT: "PhotoPractice.xcodeproj"
        XCODE_SCHEME: "PhotoPractice"
        APP_STORE_APPLE_ID: ""
    scripts:
      - name: Show app source size
        script: |
          du -sh .
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Configure bundle id
        script: |
          bash scripts/set-ios-bundle-id.sh "$BUNDLE_ID"
      - name: Validate reader app source
        script: |
          bash scripts/validate-ios-offline.sh
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up App Store code signing
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
