name: PhotoPractice
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
targets:
  PhotoPractice:
    type: application
    platform: iOS
    sources:
      - path: PhotoPractice/App
      - path: PhotoPractice/Models
      - path: PhotoPractice/Services
      - path: PhotoPractice/Views
    resources:
      - path: PhotoPractice/Assets.xcassets
      - path: PhotoPractice/Resources/PhotoMetadata
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.photopractice
        INFOPLIST_FILE: PhotoPractice/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
